[general]
import = [
    "~/.config/alacritty/themes/noctalia.toml",
]
[cursor.style]
blinking = "Off"

[env]
TERM = "xterm-256color"

[terminal]
osc52="CopyPaste"

[font]
size = 14.0

[font.normal]
family = "MonaspiceXe Nerd Font"

[font.offset]
x = 0
y = 6

[scrolling]
history = 10000
multiplier = 3

[window]
decorations = "none"
opacity = 0.9
startup_mode = "Maximized"
option_as_alt = "OnlyLeft" 

[window.dimensions]
columns = 150
lines = 42

[window.position]
x = 50
y = 100

[window.padding]
x = 0
y = 0

