git:
  ignoreWhitespaceInDiffView: true
  diffRenderers:
    - command: delta --dark --paging=never --syntax-theme='Catppuccin Mocha' --true-color=always
      colorArg: always
gui:
  expandFocusedSidePanel: true
  sidePanelWidth: 0.2 # number from 0 to 1
  nerdFontsVersion: "3"
  border: "rounded"
  skipDiscardChangeWarning: true
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    searchingActiveBorderColor:
      - "#f9e2af"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    inactiveViewSelectedLineBgColor:
      - "#6c7086"
    cherryPickedCommitFgColor:
      - "#89b4fa"
    cherryPickedCommitBgColor:
      - "#45475a"
    markedBaseCommitFgColor:
      - "#89b4fa"
    markedBaseCommitBgColor:
      - "#f9e2af"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"

  authorColors:
    "*": "#b4befe"
