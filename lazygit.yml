git:
  ignoreWhitespaceInDiffView: true
  diffRenderers:
    # No --dark: a CLI flag would beat the value noctalia writes to git config.
    - command: delta --paging=never --true-color=always
      colorArg: always
gui:
  # theme comes from noctalia via LG_CONFIG_FILE, see .zshrc
  theme:
    activeBorderColor:
      - "#b7b7b7"
      - bold
    inactiveBorderColor:
      - "#939393"
    searchingActiveBorderColor:
      - "#999999"
      - bold
    optionsTextColor:
      - "#909090"
    selectedLineBgColor:
      - "#333333"
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - "#909090"
    cherryPickedCommitBgColor:
      - "#999999"
    markedBaseCommitFgColor:
      - "#999999"
    markedBaseCommitBgColor:
      - "#dddddd"
    unstagedChangesColor:
      - "#dddddd"
    defaultFgColor:
      - "#828282"
  expandFocusedSidePanel: true
  sidePanelWidth: 0.2 # number from 0 to 1
  nerdFontsVersion: "3"
  border: "rounded"
  skipDiscardChangeWarning: true
