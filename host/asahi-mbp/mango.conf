# MacBook Pro 14" M1 Pro, Fedora Asahi Remix (aarch64)

monitorrule=name:eDP-1,scale:1.5

# XWayland is excluded from compositor scaling, so it needs its own DPI.
exec-once=echo "Xft.dpi: 144" | xrdb -merge

# Terra still builds mango 0.17.4 for aarch64, which predates the 0.18.0 key
# renaming and skips every key in the shared config. The old spellings below
# put those values back. This machine has no error nag, so the skipped keys
# cost nothing but log lines. Delete the whole block once it runs 0.18.0.
shadowscolor= 0x000000ff
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1
default_mfact=0.55
default_nmaster=1
smartgaps=0
dwindle_hsplit=1
dwindle_vsplit=1
overviewgappi=5
overviewgappo=30
idleinhibit_ignore_visible=0
idleinhibit_when_fullscreen=0
sloppyfocus=1
warpcursor=1
focusdir_only_zone_overlap=1
numlockon=0
gappih=5
gappiv=5
gappoh=10
gappov=10
borderpx=4
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile
windowrule=isfloating:1,title:^Picture[- ]in[- ][Pp]icture$
exec-once=noctalia -d
layerrule=animation_type_open:zoom,layer_name:noctalia-attached-panel
layerrule=animation_type_close:zoom,layer_name:noctalia-attached-panel
devicerule=type:trackpad,accel_speed:0.4
