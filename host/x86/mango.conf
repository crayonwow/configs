# x86_64 laptop. Fill in on the hardware:
#   mmsg get all-monitors   output name
#   mmsg get all-devices    input device names
#
monitor_rule=name:eDP-1,scale:1.5
# monitor_rule=name:HDMI-A-1,width:1920,height:1080,refresh:120,scale:1
monitor_rule=name:DP-3,width:3840,height:2160,refresh:240,scale:1.5
# monitor_rule=name:DP-3,width:1920,height:1080,refresh:240,scale:1
exec_once=echo "Xft.dpi: 96" | xrdb -merge

# lid: turn off internal panel when closed, bring it back when opened
switchbind=fold,disable_monitor,eDP-1
switchbind=unfold,enable_monitor,eDP-1
# switchbind only fires on lid events, so re-check the lid on startup and every
# reload. The monitor_rule above has no disable:1, so reset_option() ->
# reapply_monitor_rules() unconditionally re-enables eDP-1 on every reload,
# undoing a previous disable_monitor from a closed lid -- and it runs this
# exec *before* that reapply, so disabling right away would just get
# overridden a moment later (the screen flashes on). Poll for mango to report
# eDP-1 active instead of guessing a fixed delay: this also guarantees we
# never call disable_monitor on an already-inactive output, which segfaults
# mango 0.18.0 and drops back to sddm.
exec=sh -c 'grep -q closed /proc/acpi/button/lid/*/state || exit 0; for i in $(seq 1 50); do mmsg get monitor eDP-1 | grep -q "\"active\":true" && exec mmsg dispatch disable_monitor,eDP-1; sleep 0.1; done'
