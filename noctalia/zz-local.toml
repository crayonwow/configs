# Hand-written layer. Must sort after config.toml: sync.sh regenerates
# that file from the merged config, so it ends up holding a stale copy of
# everything below.

# Replaces the community "tmux" template, which must stay disabled: its
# apply.sh appends a source-file line to .tmux.conf, and that file is a
# tmux/shell hybrid where `cut -c3-` mangles it into `urce-file`, making
# every config apply exit 127. .tmux.conf.local sources the theme instead.
[theme.templates.user.tmux]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/tmux.conf"
output_path = "$XDG_CONFIG_HOME/tmux/themes/noctalia.conf"
post_hook = 'sh "$HOME/configs/tmux/noctalia-reload.sh"'

# delta reads its syntax theme and dark/light flag from git config, not
# from bat's, and lazygit renders diffs through delta. Two inputs because
# light/dark is a flag, not a colour.
[theme.templates.user.delta]
output_path = "$XDG_CONFIG_HOME/git/noctalia-delta.gitconfig"

[theme.templates.user.delta.input_path_modes]
dark = "$XDG_CONFIG_HOME/noctalia/templates/delta-dark.gitconfig"
light = "$XDG_CONFIG_HOME/noctalia/templates/delta-light.gitconfig"

# Replaces the community "lazygit" template, which must stay disabled: its
# apply.sh writes into config.yml, a symlink into this repo. See .zshrc.
[theme.templates.user.lazygit]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/lazygit.yml"
output_path = "$XDG_CONFIG_HOME/lazygit/noctalia-theme.yml"

# Replaces the builtin "mango" template, which must stay disabled for two
# reasons: it emits the pre-0.18.0 key names, and its apply.sh appends a
# `source=` line to config.conf — a symlink into this repo — whenever it
# fails to match `source(-optional)?`, which our `source_optional` does not.
[theme.templates.user.mango]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/mango.conf"
output_path = "$XDG_CONFIG_HOME/mango/noctalia.conf"
post_hook = 'sh "$HOME/configs/mango/noctalia-apply.sh"'

# Built-in polkit agent (password prompt for snap/App Center, pkexec).
# mango has no other agent; only one can register per session.
[shell]
polkit_agent = true
